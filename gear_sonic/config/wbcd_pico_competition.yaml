# WBCD Sonic competition teleop config.
# This file is hot-reloaded by gear_sonic/scripts/pico_manager_thread_server.py.
# Tune these values during practice without rebuilding deploy-side code.

enabled: true

# Seconds between config reload checks.
reload_interval_sec: 1.0

height:
  # Upper-shelf manipulation. -1.0 means use the planner's default standing height.
  stand_manip: -1.0

  # Middle-shelf manipulation.
  half_squat_default: 0.55
  half_squat_min: 0.45
  half_squat_max: 0.62

  # Low-shelf static kneel manipulation. Enter only after HALF_SQUAT_MANIP.
  kneel_default: 0.50
  kneel_min: 0.30
  kneel_max: 0.70
  kneel_adjust_step_m: 0.02

  # Height changes while holding Y/X in HALF_SQUAT_MANIP.
  # In KNEEL_MANIP, the same keys step height once per press by kneel_adjust_step_m.
  adjust_speed_mps: 0.06

  # Hold left_menu+B to rise toward this height. Release B to pause.
  stand_recovery_target: 0.74
  stand_recovery_speed_mps: 0.10

entry:
  # Require deploy feedback before entering WBCD manipulation modes.
  # This lets the VR_3PT mapping start from the robot's current arm pose.
  require_robot_feedback: true

  # After entering HALF_SQUAT_MANIP, hold standing height briefly before lowering.
  hold_before_squat_sec: 0.30

  # Speed used to lower from standing height into half squat.
  squat_enter_speed_mps: 0.08

  # Print per-frame VR target positions for debugging only.
  print_vr_target_debug: false

movement:
  # Joystick dead zone used only in WBCD manipulation/recovery modes.
  joystick_dead_zone: 0.10

  # STAND_MANIP allows slow forward/back movement and yaw.
  stand_manip_max_vx: 0.10
  stand_manip_max_wz: 0.25

  # STAND_RECOVERY allows slow backing/yaw while rising or paused.
  stand_recovery_max_vx: 0.08
  stand_recovery_max_wz: 0.25

  # IDLE_SQUAT is static on the deploy side, so keep this false for v1.
  half_squat_allow_motion: false

buttons:
  # Mode buttons are chorded with left_menu_button to avoid normal Sonic conflicts.
  modifier: left_menu_button
  stand_manip: A
  half_squat_manip: X
  kneel_manip: Y
  hold_stand_recovery: B

  # Height adjustment only applies when left_menu is not held.
  # HALF_SQUAT_MANIP: hold to adjust continuously.
  # KNEEL_MANIP: press once to adjust one step.
  height_up: Y
  height_down: X

logging:
  print_mode_changes: true
  print_config_reload: true
